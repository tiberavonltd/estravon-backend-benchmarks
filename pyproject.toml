[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "estravon-backend-benchmarks"
dynamic = ["version"]
description = "Apples-to-apples PDF-to-Markdown engine comparison for estravon-backend"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [{name = "tiberavonltd", email = "info@estravon.com"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["httpx", "fastdownload"]

[project.optional-dependencies]
dev = ["nbdev"]

[project.urls]
Repository = "https://github.com/tiberavonltd/estravon-backend-benchmarks"
Documentation = "https://tiberavonltd.github.io/estravon-backend-benchmarks/"

[project.entry-points.nbdev]
estravon_bench = "estravon_bench._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "estravon_bench.__version__"}

[tool.setuptools.packages.find]
include = ["estravon_bench"]

[tool.nbdev]
lib_path = "estravon_bench"
